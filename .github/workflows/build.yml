# Runs the whole suite on every push, so a broken main branch is visible to
# anybody looking at the repository rather than only to whoever ran the tests
# last. The Android job proves the thing this project claims: that the game's
# rules compile for a phone without being changed.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  game:
    name: Game and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-results
          path: target/surefire-reports/

  server:
    name: Leaderboard service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The server scores runs by replaying them with the game's own classes,
      # so the game has to be installed before the server can even compile.
      - name: Install the game artifact
        run: mvn -B install -DskipTests

      - name: Build and test the server
        working-directory: server
        run: mvn -B verify

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-lost-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
