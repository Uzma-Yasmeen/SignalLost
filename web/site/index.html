<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<meta name="description" content="A turn-based fog-of-war stealth game. Collect the keys, reach the exit, stay out of sight.">

<!-- iOS needs its own words for the same ideas. These are what make
     Add to Home Screen open fullscreen rather than in Safari. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Lost">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Signal Lost</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c12; overflow: hidden;
               overscroll-behavior: none; }
  canvas { display: block; touch-action: manipulation; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             color: #8c96af; font: 16px system-ui, sans-serif; }
  /* The name screen borrows the browser's own input, so phones get a real
     keyboard rather than one drawn on a canvas. */
  #name { position: fixed; left: 50%; top: 46%; transform: translateX(-50%);
          width: min(60vw, 420px); padding: 14px 18px; font: 20px system-ui, sans-serif;
          text-align: center; color: #e8ecf6; background: #141824;
          border: 1px solid #3a4664; border-radius: 14px; outline: none; }
</style>
</head>
<body>
  <div id="loading">loading…</div>
  <canvas id="board"></canvas>
  <input id="name" type="text" maxlength="40" placeholder="name"
         autocomplete="off" autocapitalize="words" style="display:none">
  <script src="signal-lost.js"></script>
  <script>
    document.getElementById('loading').remove();
    main();

    // A service worker updates the NEXT time the app is opened: the code in a
    // window that is already running was parsed into memory when it opened, and
    // a new worker governs future requests, not the running program. A phone
    // kills background apps often enough that this goes unnoticed; a desktop
    // window left open for days quietly keeps playing an old build, which is
    // exactly what happened to us.
    //
    // So the page says when a newer version has arrived, and the game applies
    // it at the title screen, where nothing is in progress.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Fires once the replacement worker has taken over this page.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.__signalLostUpdateReady = true;
        });
        // A window open for hours would otherwise not re-check for a day.
        setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) { reg.update().catch(() => {}); }
        });
      }).catch(() => {});
    }
  </script>
</body>
</html>
