# Default profile: an embedded database kept in a file beside the server, so
# the service starts with nothing to install and still remembers its players
# after a restart. A backend you cannot run without first setting up a database
# is a backend nobody tries; one that forgets everyone when it stops is not
# storing users at all.
spring:
  application:
    name: signal-lost-leaderboard

  datasource:
    url: jdbc:h2:file:./data/signallost;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

  # The browser build is served from here too, so the game and its API share
  # an origin: one address to open, and no cross-origin rules to configure.
  web:
    resources:
      static-locations: classpath:/static/,file:../web/dist/
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # Flyway owns the schema. Hibernate is told to leave it alone, so the
    # tables the tests run against are the tables production gets.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

---
# The profile a deployment would use. Credentials come from the environment,
# never from this file.
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/signallost}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:signallost}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
